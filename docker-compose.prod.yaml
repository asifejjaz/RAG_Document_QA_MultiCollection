---
# Production-oriented compose: no source bind-mount, pinned images,
# non-root app (see Dockerfile).
# Usage:
#   docker compose -f docker-compose.prod.yaml --env-file .env up -d --build
#
# Copy .env.example → .env and fill secrets before deploy.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: rag-qdrant-prod
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data_prod:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: eva-research-rag:${RAG_IMAGE_TAG:-latest}
    container_name: rag-api-prod
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - rag_data_prod:/data:ro
      - rag_state_prod:/state
      - rag_sessions_prod:/app/sessions
    environment:
      - DATA_ROOT=/data
      - STATE_ROOT=/state
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_DB_URL=http://qdrant:6333
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0

  ollama:
    # Pin to a specific digest in production after `docker pull ollama/ollama`
    image: ollama/ollama:0.5.7
    container_name: rag-ollama-prod
    ports:
      - "11434:11434"
    volumes:
      - ollama_models_prod:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    networks:
      - rag-network

volumes:
  qdrant_data_prod:
    name: qdrant_data_prod
  rag_data_prod:
    name: rag_data_prod
  rag_state_prod:
    name: rag_state_prod
  rag_sessions_prod:
    name: rag_sessions_prod
  ollama_models_prod:
    name: ollama_models_prod

networks:
  rag-network:
    driver: bridge
