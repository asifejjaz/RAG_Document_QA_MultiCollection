services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # RAG API Service
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    env_file: .env
    ports:
      - "8501:8501"  # Streamlit
      - "8000:8000"  # Optional: FastAPI if you add it later
    volumes:
      # Mount corpus data as read-only
      - ./data:/data:ro
      # Mount state/output directory
      - rag_state:/state
      # Mount sessions directory
      - ./sessions:/app/frontend/sessions
      # Mount app code so edits apply without rebuild (Streamlit auto-reloads)
      - .:/app
    environment:
      - DATA_ROOT=/data
      - STATE_ROOT=/state
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_DB_URL=http://qdrant:6333
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - rag-network
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.port=8501 --server.address=0.0.0.0

  # Ollama (local LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    networks:
      - rag-network

# Named volumes
volumes:
  qdrant_data:
    name: qdrant_data
  rag_state:
    name: rag_state
  ollama_models:
    name: ollama_models

# Network
networks:
  rag-network:
    driver: bridge