version: '3.8'

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # RAG API Service
  rag-api:
    build:
      context: ..
      dockerfile: client_folder/Dockerfile
    container_name: rag-api
    ports:
      - "8501:8501"  # Streamlit
      - "8000:8000"  # Optional: FastAPI if you add it later
    volumes:
      # Mount corpus data as read-only
      - ../data:/data:ro
      # Mount state/output directory
      - rag_state:/state
      # Mount sessions directory
      - ./sessions:/app/client_folder/frontend/sessions
    environment:
      # Paths
      - DATA_ROOT=/data
      - STATE_ROOT=/state
      
      # Vector DB
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_PORT=6333
      
      # Azure OpenAI (load from .env file)
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2023-05-15}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME}
      - AZURE_OPENAI_MODEL=${AZURE_OPENAI_MODEL:-gpt-4}
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0

# Named volumes
volumes:
  qdrant_data:
    name: qdrant_data
  rag_state:
    name: rag_state

# Network
networks:
  rag-network:
    driver: bridge